<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RabbitGlobe</title>
    <script>
      // Apply the host-passed colorScheme before the stylesheet loads so the
      // first paint is already in the correct theme — no flash of the wrong
      // colors. Falls back to prefers-color-scheme via CSS when this param is
      // absent (e.g., standalone load during development).
      (function () {
        var v = new URLSearchParams(location.search).get('colorScheme');
        if (v === 'light' || v === 'dark') {
          document.documentElement.dataset.colorScheme = v;
        }
      })();
    </script>
    <!-- Leaflet's stylesheet, copied from the bundled package at build time. -->
    <link rel="stylesheet" href="./leaflet.css?v=__BUILD_ID__" />
    <!-- Shared leaderboard component styles. Loaded BEFORE our own stylesheet
         so the game keeps the last word on anything it overrides. Its JS is
         bundled into main.js (this game has a bundler), so no script tag. -->
    <link rel="stylesheet" href="../leaderboard-v1.css?v=__UI_VERSION__" />
    <link rel="stylesheet" href="./styles.css?v=__BUILD_ID__" />
    <script src="../sdk-v1.js?v=__SDK_VERSION__"></script>
  </head>
  <body>
    <header>
      <h1>RabbitGlobe</h1>
      <p class="tagline">Guess where the photo was taken. Three rounds, one pin each.</p>
    </header>
    <main id="root" aria-live="polite"></main>
    <script type="module" src="./main.js?v=__BUILD_ID__"></script>
  </body>
</html>
