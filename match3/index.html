<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Fruit Match</title>
    <!-- Shared leaderboard component. Stylesheet first so our own styles.css
         keeps the last word; the script installs window.OddsRabbitUI, which
         js/leaderboard.js reads. This game has no bundler, so both arrive as
         plain tags rather than an import. -->
    <link rel="stylesheet" href="../leaderboard-v1.css?v=__UI_VERSION__" />
    <link rel="stylesheet" href="./styles.css?v=__BUILD_ID__" />
    <script src="../sdk-v1.js?v=__SDK_VERSION__"></script>
    <script src="../leaderboard-v1.js?v=__UI_VERSION__"></script>
  </head>
  <body>
    <div class="container">
      <div class="heading">
        <h1 class="title">FRUIT MATCH</h1>
        <div class="scores-container">
          <div class="score-container" aria-label="Score 0">0</div>
          <div class="best-container" aria-label="Best 0">0</div>
        </div>
      </div>

      <div class="above-game">
        <p class="game-intro">Swap fruits to line up 3 or more.</p>
        <!-- Both leaderboard buttons start `hidden`; js/leaderboard.js reveals
             them only once the host has said it can serve a global board. -->
        <button type="button" class="restart-button">New Game</button>
        <button type="button" class="leaderboard-button" hidden>Leaderboard</button>
      </div>

      <div class="timer-row">
        <div class="timer">
          <div class="timer-fill"></div>
        </div>
        <!-- Score-driven drain multiplier (e.g. "×1.8"). Surfaced only when
             the speed-up is perceptible so the bar stays clean at low scores. -->
        <span class="timer-speed" aria-hidden="true"></span>
        <!-- Sound on/off. Procedural audio (js/sound_manager.js) is on by
             default; this lets a player silence it. aria-pressed reflects the
             muted state and is kept in sync from application.js. -->
        <button type="button" class="sound-toggle" aria-label="Mute sound" aria-pressed="false">🔊</button>
      </div>

      <div class="game-container">
        <div class="board-frame">
          <!-- tabindex makes the canvas focusable; keyboard handlers in
               input_manager.js bind here so arrow keys still scroll the
               page when the canvas isn't focused. -->
          <canvas class="game-canvas" aria-label="Fruit match board" tabindex="0"></canvas>
        </div>

        <!-- Cascade combo banner. Pops up on combo ≥2; hidden by default.
             aria-live=off — a long cascade would otherwise spam screen
             readers with "COMBO ×2! +12" through "COMBO ×6! +144" in
             rapid succession. The final score lives in the game-over
             overlay, which IS announced. -->
        <div class="combo-banner" aria-live="off"></div>

        <!-- Board-wide radial flash; fires alongside the stage banner to
             draw the eye even if the player was watching a cascade. -->
        <div class="stage-flash" aria-hidden="true"></div>

        <!-- Stage advancement banner. Fires once per stage transition
             (2→3, 3→4, etc.); polite live region so the new ruleset
             label is announced once. -->
        <div class="stage-banner" aria-live="polite"></div>

        <div class="game-message" data-state="idle">
          <p class="game-message-text"></p>
          <p class="final-score"></p>
          <p class="new-best-note"></p>
          <div class="lower">
            <button type="button" class="start-button">Start</button>
            <button type="button" class="resume-button">Resume</button>
            <button type="button" class="retry-button">Try again</button>
            <button type="button" class="share-button">Share</button>
            <button type="button" class="leaderboard-button-overlay" hidden>Leaderboard</button>
          </div>
        </div>
      </div>

      <p class="game-explanation">
        <strong class="important">How to play:</strong> Tap or swipe a fruit toward a neighbour to swap. Match 3+ in a row to score. Longer matches score more and add seconds to the clock.
      </p>
    </div>

    <script src="./js/input_manager.js?v=__BUILD_ID__"></script>
    <script src="./js/storage_manager.js?v=__BUILD_ID__"></script>
    <script src="./js/game.js?v=__BUILD_ID__"></script>
    <script src="./js/renderer.js?v=__BUILD_ID__"></script>
    <script src="./js/sound_manager.js?v=__BUILD_ID__"></script>
    <script src="./js/application.js?v=__BUILD_ID__"></script>
    <script src="./js/leaderboard.js?v=__BUILD_ID__"></script>
  </body>
</html>
