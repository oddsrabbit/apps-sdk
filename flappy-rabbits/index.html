<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <!-- Edge to edge: the scene runs under the status bar and home indicator,
         and the HUD is the header row, beside the app's back button. Must come
         before the SDK script. See docs/game-header-guidelines.md. -->
    <meta name="oddsrabbit-chrome" content="edge" />
    <title>Flappy Rabbits</title>
    <!-- Shared leaderboard component. Stylesheet first so our own styles.css
         keeps the last word; the script installs window.OddsRabbitUI, which
         js/leaderboard.js reads. This game has no bundler, so both arrive as
         plain tags rather than an import. -->
    <link rel="stylesheet" href="../leaderboard-v1.css?v=__UI_VERSION__" />
    <link rel="stylesheet" href="./styles.css?v=__BUILD_ID__" />
    <script src="../sdk-v1.js?v=__SDK_VERSION__"></script>
    <script src="../leaderboard-v1.js?v=__UI_VERSION__"></script>
  </head>
  <body>
    <!-- FULL-BLEED BY DESIGN. There is no page chrome around the board: the
         canvas is the screen, and every piece of UI is either drawn into the
         scene or floated over it. The game's own text (title, how to play)
         lives on the idle overlay, where it is read once and then gone,
         instead of framing the board forever.

         The stage shrink-wraps the canvas — js/renderer.js sets the canvas's
         CSS size to fill the viewport — so the HUD and the overlay, which are
         positioned against the stage, always land exactly over the picture and
         never in the letterbox a wide desktop window leaves. -->
    <div class="stage">
      <!-- 320x480 is the world's MINIMUM, and what these attributes give the
           browser to lay out with before the scripts run. Both buffer
           dimensions are then set from the viewport at runtime (see
           HopRenderer.resize), and upscaled by CSS with
           `image-rendering: pixelated`.

           The play field inside that buffer never changes: spare height is
           drawn as extra sky above and extra earth below, and spare width as
           garden the rabbit has already passed — the rabbit rides a constant
           244px in from the right edge, so the run-up in front of it is the
           same on every device. A bigger screen shows more scenery, never more
           playable room and never more warning. -->
      <canvas class="game-canvas" width="320" height="480" aria-label="Flappy Rabbits game board"></canvas>

      <!-- HUD. Floats over the sky, which is the emptiest part of the scene
           and the one part no obstacle ever occupies (js/game.js keeps every
           gap clear of the ceiling by GAP_MARGIN_TOP). `pointer-events: none`
           on the bar, restored on the controls, so the dead space between them
           still passes a tap through to the board as a hop. -->
      <div class="hud">
        <div class="hud-controls">
          <!-- Pause needs its own control: every tap on the board is a hop, so
               there is no spare tap gesture to overload. Hidden outside a live
               run by application.js. -->
          <!-- Drawn, not the ❚❚ glyph, for the same reason as the sound toggle
               below: U+275A comes from a fallback font whose side bearings and
               baseline sit where that font wants them, not centred on the em
               box, so no amount of flex centring lands it in the middle of the
               chip. Two rects on a 16x16 grid are centred by construction. -->
          <button type="button" class="pause-button" aria-label="Pause" hidden>
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
              <rect x="4" y="3" width="3" height="10" fill="currentColor" />
              <rect x="9" y="3" width="3" height="10" fill="currentColor" />
            </svg>
          </button>
          <!-- Drawn, not an emoji. The colour glyphs (🔊 / 🔇) are the one thing
               on screen rendered by the system's emoji font: full-colour,
               rounded and anti-aliased, floating over a scene made of flat
               integer rects. Inline SVG inherits `currentColor`, so it takes
               the chip's own colour, and CSS swaps the waves for a slash off
               `aria-pressed` — so the state lives in one place. -->
          <button type="button" class="sound-toggle" aria-label="Mute sound" aria-pressed="false">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
              <path d="M1.5 6h3.4L9 2.6v10.8L4.9 10H1.5z" fill="currentColor" />
              <g class="sound-wave" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
                <path d="M11.3 5.6a3.4 3.4 0 0 1 0 4.8" />
                <path d="M13.4 3.4a6.4 6.4 0 0 1 0 9.2" />
              </g>
              <path class="sound-slash" d="M2.2 13.8 13.8 2.2" fill="none" stroke="currentColor"
                    stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </button>
        </div>
        <div class="scores-container">
          <div class="score-container" aria-label="Score 0">0</div>
          <div class="best-container" aria-label="Best 0">0</div>
        </div>
      </div>

      <div class="game-message" data-state="idle">
        <h1 class="title">FLAPPY<br />RABBITS</h1>
        <p class="game-message-text"></p>
        <p class="final-score"></p>
        <p class="new-best-note"></p>
        <div class="lower">
          <button type="button" class="start-button">Start</button>
          <button type="button" class="resume-button">Resume</button>
          <button type="button" class="restart-button">New Game</button>
          <button type="button" class="retry-button">Try again</button>
          <button type="button" class="share-button">Share</button>
          <!-- Both leaderboard buttons start `hidden`; js/leaderboard.js reveals
               them only once the host has said it can serve a global board. One
               for the idle/paused overlay and one for game over, because the
               two sit in different button rows. -->
          <button type="button" class="leaderboard-button" hidden>Leaderboard</button>
          <button type="button" class="leaderboard-button-overlay" hidden>Leaderboard</button>
        </div>
        <p class="game-explanation">
          Tap or press space to hop. Every gap you clear scores a point. The gaps
          narrow and the garden speeds up the further you get — touch a hedge or
          the ground and the run ends.
        </p>
      </div>
    </div>

    <script src="./js/input_manager.js?v=__BUILD_ID__"></script>
    <script src="./js/storage_manager.js?v=__BUILD_ID__"></script>
    <script src="./js/sound_manager.js?v=__BUILD_ID__"></script>
    <script src="./js/game.js?v=__BUILD_ID__"></script>
    <script src="./js/renderer.js?v=__BUILD_ID__"></script>
    <script src="./js/application.js?v=__BUILD_ID__"></script>
    <script src="./js/leaderboard.js?v=__BUILD_ID__"></script>
  </body>
</html>
