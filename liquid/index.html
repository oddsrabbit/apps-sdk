<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Liquid</title>
    <script>
      // Apply the host-passed colorScheme before the stylesheet loads so the
      // first paint is already in the correct theme — no flash of the wrong
      // colors. Falls back to prefers-color-scheme via CSS when this param is
      // absent (e.g., standalone load during development).
      (function () {
        var v = new URLSearchParams(location.search).get('colorScheme');
        if (v === 'light' || v === 'dark') {
          document.documentElement.dataset.colorScheme = v;
        }
      })();
    </script>
    <style>
      * { user-select: none; }
      html, body { overflow: hidden; background-color: #000; }
      body { margin: 0; position: fixed; width: 100%; height: 100%; }
      canvas { width: 100%; height: 100%; display: block; }
      .dg { opacity: 0.9; }
      .dg .property-name { overflow: visible; }
      .bigFont { font-size: 150%; color: #8C8C8C; }
      .bootstrap-error {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        max-width: 80vw; padding: 16px 20px; border-radius: 8px;
        background: rgba(255, 255, 255, 0.95); color: #1a1a1a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px; line-height: 1.5; text-align: center; z-index: 1000;
      }
    </style>
    <script src="../sdk-v1.js?v=__BUILD_ID__"></script>
    <script src="./js/dat.gui.min.js?v=__BUILD_ID__"></script>
  </head>
  <body>
    <canvas></canvas>
    <script src="./js/script.js?v=__BUILD_ID__"></script>
    <script src="./js/bootstrap.js?v=__BUILD_ID__"></script>
  </body>
</html>
